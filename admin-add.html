<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Product - Araria Mart</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        /* ============================================
           SIMPLE ADMIN - SIRF PRODUCT ADD
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f6f9;
            color: #2c3e50;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        /* HEADER */
        header {
            text-align: center;
            padding: 25px 20px;
            background: linear-gradient(135deg, #1a237e, #ff6f00);
            color: white;
            border-radius: 16px;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        header p {
            font-size: 16px;
            opacity: 0.85;
        }

        /* ADMIN PANEL */
        .admin-panel {
            max-width: 100%;
            margin: 0 auto 30px;
            padding: 25px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .admin-panel h2 {
            color: #1a237e;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 22px;
            border-bottom: 2px solid #ff6f00;
            padding-bottom: 10px;
        }

        /* FORM */
        .admin-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .admin-form input {
            padding: 12px 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .admin-form input:focus {
            border-color: #ff6f00;
            outline: none;
        }

        .admin-form button {
            padding: 14px;
            background: linear-gradient(135deg, #1a237e, #ff6f00);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 5px;
        }

        .admin-form button:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(255, 111, 0, 0.4);
        }

        /* STATUS MESSAGE */
        .status-msg {
            padding: 12px 16px;
            border-radius: 8px;
            margin: 10px 0;
            display: none;
            font-weight: 500;
        }

        .status-msg.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        .status-msg.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }

        /* INSTRUCTION */
        .instruction {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            border-left: 4px solid #1a237e;
        }

        .instruction p {
            margin: 5px 0;
            color: #0d47a1;
        }

        .instruction strong {
            color: #1a237e;
        }

        /* RESPONSIVE */
        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            header h1 {
                font-size: 22px;
            }

            .admin-panel {
                padding: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <header>
            <h1>➕ Add Product - Araria Mart</h1>
            <p>Sirf product add karne ke liye (delete nahi)</p>
        </header>

        <!-- ADD PRODUCT SECTION -->
        <div class="admin-panel">
            <h2>🛒 Add New Product</h2>
            <div class="admin-form">
                <input type="text" id="newName" placeholder="Product Name *" />
                <input type="number" id="newPrice" placeholder="Price (₹) *" />
                <input type="text" id="newDetail" placeholder="Detail (Size, Qty) - optional" />
                <input type="text" id="newImage" placeholder="Image URL (direct link) - optional" />
                <button id="saveProductBtn">✅ Add Product</button>
                <div id="addMsg" class="status-msg"></div>
            </div>

            <!-- INSTRUCTION -->
            <div class="instruction">
                <p>📌 <strong>Product Add Karne Ke Baad:</strong></p>
                <p>1️⃣ Product add karein</p>
                <p>2️⃣ <strong>index.html</strong> refresh karein</p>
                <p>3️⃣ Naya product dikhega!</p>
            </div>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- 📱 JAVASCRIPT - SIRF PRODUCT ADD             -->
    <!-- ============================================ -->
    <script>
        // ============================================
        // 📥 JSONBin Setup - Yahan apna BIN_ID aur API_KEY daalein
        // ============================================
        const BIN_ID = "YOUR_BIN_ID_HERE";      // ← JSONBin se copy karein
        const API_KEY = "YOUR_API_KEY_HERE";    // ← JSONBin se copy karein

        let products = [];

        // ============================================
        // 📥 Load Products
        // ============================================
        async function loadProducts() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const data = await res.json();
                products = data.record?.products || [];
                console.log("✅ Products loaded:", products.length);
            } catch (error) {
                console.log("❌ Load failed:", error);
                products = [];
            }
        }

        // ============================================
        // 💾 Save Products
        // ============================================
        async function saveProducts() {
            try {
                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify({ products })
                });
                console.log("✅ Products saved!");
                return true;
            } catch (error) {
                console.log("❌ Save failed:", error);
                return false;
            }
        }

        // ============================================
        // ➕ Add Product
        // ============================================
        document.getElementById("saveProductBtn").addEventListener("click", async function() {
            const name = document.getElementById("newName").value.trim();
            const price = parseInt(document.getElementById("newPrice").value);
            const detail = document.getElementById("newDetail").value.trim();
            let image = document.getElementById("newImage").value.trim();
            const msg = document.getElementById("addMsg");

            // Validation
            if (!name) {
                msg.textContent = '⚠️ Please enter product name!';
                msg.className = 'status-msg error';
                return;
            }
            if (!price || isNaN(price) || price <= 0) {
                msg.textContent = '⚠️ Please enter valid price!';
                msg.className = 'status-msg error';
                return;
            }
            if (!image) {
                image = 'https://i.postimg.cc/1XqzK1gR/Screenshot-2026-07-07-17-44-18-94-2c94496c64eeaa7ef093c298145d7980.jpg';
            }

            const newProduct = {
                name: name,
                price: price,
                detail: detail || 'No details',
                image: image
            };

            products.push(newProduct);
            const saved = await saveProducts();

            if (saved) {
                // Clear fields
                document.getElementById('newName').value = '';
                document.getElementById('newPrice').value = '';
                document.getElementById('newDetail').value = '';
                document.getElementById('newImage').value = '';

                msg.textContent = `✅ "${name}" added successfully! (Total: ${products.length} products)`;
                msg.className = 'status-msg success';
            } else {
                msg.textContent = '❌ Save failed! Check your internet.';
                msg.className = 'status-msg error';
            }

            setTimeout(() => {
                msg.className = 'status-msg';
                msg.textContent = '';
            }, 4000);
        });

        // ============================================
        // 🚀 START
        // ============================================
        loadProducts();
        console.log("✅ Add Product panel loaded!");
        console.log("🔒 Sirf product add kar sakte hain");
    </script>
</body>
  </html>
